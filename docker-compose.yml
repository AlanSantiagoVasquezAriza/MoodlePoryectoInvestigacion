services:

  # ── Base de datos para Moodle ──────────────────────────────
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_USER: moodle
      MARIADB_PASSWORD: moodlepass
      MARIADB_DATABASE: moodle
      MARIADB_ROOT_PASSWORD: rootpass123
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Moodle (construido desde Dockerfile) ──────────────────
  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_PORT: 3306
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASS: moodlepass
      MOODLE_URL: http://localhost:8080
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASS: "Admin1234!"
      MOODLE_ADMIN_EMAIL: admin@codelab.local
      MOODLE_SITE_NAME: "CodeLab - Editor de Código"
    volumes:
      # Datos persistentes (archivos subidos, caché, etc.)
      - moodle_data:/var/www/moodledata
      # El plugin se monta como volumen para poder editarlo sin reconstruir
      - ./mod/codelab:/var/www/moodle/mod/codelab
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  # ── Judge0: Base de datos ─────────────────────────────────
  judge0_db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0PgPass2026
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Judge0: Cola de tareas ────────────────────────────────
  judge0_redis:
    image: redis:7.2.4
    command: >
      bash -c 'redis-server --appendonly no --requirepass "judge0RedisPass2026"'
    restart: unless-stopped

  # ── Judge0: Servidor API ──────────────────────────────────
  judge0_server:
    image: judge0/judge0:latest
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0_db:
        condition: service_healthy

  # ── Judge0: Worker (ejecuta el código) ───────────────────
  judge0_worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0_db:
        condition: service_healthy

volumes:
  mariadb_data:
  moodle_data:
  judge0_db_data:
